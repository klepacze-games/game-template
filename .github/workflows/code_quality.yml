name: code_quality.yml
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  run_reformat:
    runs-on: ubuntu-latest
    name: Check code
    steps:
      #Przygotowanie narzędzi
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
      - name: Restore
        run: dotnet restore "Beyond The Worlds.sln"
      - name: Tool Restore
        run: dotnet tool restore

      #Weryfikacja
      - name: Verify CSharpier
        run: dotnet csharpier check .
      - name: Verify Analyzers
        run: dotnet format "Beyond The Worlds.sln" --verify-no-changes
      - name: Build solution
        run: dotnet build "Beyond The Worlds.sln" --no-restore

